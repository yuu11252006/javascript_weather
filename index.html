<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEATHER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>WEATHER</h1>
    <p>FUKUOKA CITY</p>
  </header>

  <main>
    <div class="container">

      <h2>今日の天気</h2>
      <p class="location">福岡県 福岡市</p>

      <div id="weather-icon">☀️</div>

      <p id="weather-text">天気を取得してください</p>

      <div id="temperature">--℃</div>

      <div class="info">
        <p>風速：<span id="wind">--</span> km/h</p>
      </div>

      <button id="get-weather-btn">天気を更新する</button>

      <p id="updated"></p>

    </div>
  </main>

  <footer>
    <p>© WEATHER INFORMATION</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
